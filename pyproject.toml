[project]
name = "gitboard"
version = "0.1.0"
description = "Read a self-hosted GitLab issue board from the terminal, or define one in YAML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-gitlab",
    "pyyaml",
    "typer",
    "rich",
    "python-dotenv",
]

[project.scripts]
gitboard = "gitboard.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]

[tool.ruff.lint.per-file-ignores]
# Test fakes are deliberately terse; a stub class per API object is the point.
"tests/*" = ["E501"]
